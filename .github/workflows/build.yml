name: build-windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller==6.11.1 pytest==8.3.4
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build exe
        run: >
          pyinstaller main.py --name Hub --noconfirm --windowed
          --collect-all faster_whisper --collect-all ctranslate2
          --hidden-import keyring.backends.Windows
      - name: Selftest exe
        shell: pwsh
        run: |
          $env:HUB_SELFTEST = "$PWD\selftest.txt"
          $p = Start-Process dist/Hub/Hub.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "timeout"; exit 1 }
          Get-Content selftest.txt
          if ((Get-Content selftest.txt -Raw).Trim() -ne "OK") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Hub-windows
          path: dist/Hub
      - name: Publier release "latest"
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/Hub/* -DestinationPath Hub-windows.zip
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create latest --title "Hub (dernière version)" --notes "Build automatique de main." --latest }
          gh release upload latest Hub-windows.zip --clobber
